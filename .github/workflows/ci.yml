name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install app dependencies from npm lockfile
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build app
        run: npm run build
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Verify Bun lockfile
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun test
      - name: Bundle ingest CLI
        run: bun build workers/ingest/run.ts --target=bun --outdir=/tmp/signalcar-ingest-build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: "2.106.0"
      - name: Apply all migrations to a disposable local database
        run: supabase db start
      - name: Test RLS and data contracts
        shell: bash
        run: |
          set -euo pipefail
          project_id=$(sed -n 's/^project_id = "\([^"]*\)"/\1/p' supabase/config.toml)
          test -n "$project_id"
          db_container="supabase_db_${project_id}"
          docker inspect "$db_container" >/dev/null
          for sql_file in supabase/tests/*.sql; do
            docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$sql_file" > /tmp/signalcar-sql-test.log 2>&1 || {
              printf 'FAIL %s\n' "$sql_file"
              tail -n 30 /tmp/signalcar-sql-test.log
              exit 1
            }
            printf 'PASS %s\n' "$sql_file"
          done
