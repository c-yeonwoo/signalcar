name: Ingest Loop

on:
  schedule:
    # 06:00 KST = 21:00 UTC previous day. Keep unchanged while production is gated.
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Optional job ID to preview; blank previews all daily jobs"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Preview enabled jobs without DB access or writes
        env:
          INGEST_JOB: ${{ inputs.job }}
        run: |
          args=(loop --dry --no-claim)
          if [ -n "$INGEST_JOB" ]; then
            args+=(--job "$INGEST_JOB")
          fi
          bun workers/ingest/run.ts "${args[@]}"

  production:
    if: github.event_name == 'schedule' && vars.SIGNALCAR_INGEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: signalcar-production
    timeout-minutes: 30
    concurrency:
      group: signalcar-ingest-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Run daily ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            printf 'Missing production Supabase secrets\n' >&2
            exit 1
          fi
          bun workers/ingest/run.ts loop
