name: Ingest Loop

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Optional job ID to preview; blank previews all daily jobs"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Preview enabled jobs without DB access or writes
        env:
          INGEST_JOB: ${{ inputs.job }}
        run: |
          args=(loop --dry --no-claim)
          if [ -n "$INGEST_JOB" ]; then
            args+=(--job "$INGEST_JOB")
          fi
          bun workers/ingest/run.ts "${args[@]}"
